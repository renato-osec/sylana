<title>Deciphered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#e9ece7; --panel:#ffffff; --panel-2:#f4f7f2; --line:#dde2db;
    --ink:#18212e; --ink-2:#4d5766; --muted:#8b94a2; --accent:#0f9b50;
    --shadow:0 1px 2px rgba(20,30,25,.06),0 8px 30px rgba(20,30,25,.08);
    --sans:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0c0f14; --panel:#12171f; --panel-2:#171e28; --line:#222c39;
    --ink:#e8eef4; --ink-2:#a2b2c2; --muted:#5f6d81; --accent:#37d67a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.45);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0c0f14; --panel:#12171f; --panel-2:#171e28; --line:#222c39;
    --ink:#e8eef4; --ink-2:#a2b2c2; --muted:#5f6d81; --accent:#37d67a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.45);
    color-scheme:dark;
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
  *{box-sizing:border-box}
  .app{display:flex;flex-direction:column;height:100%;padding:0 16px}
  /* ---- header ---- */
  header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding-block:14px 10px;border-bottom:1px solid var(--line)}
  .brand{display:flex;flex-direction:column;gap:2px;min-width:0}
  .wordmark{font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent)}
  .prog{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
  .grow{flex:1 1 auto}
  .meta{display:flex;gap:16px;align-items:baseline;font-family:var(--mono);
    font-size:11.5px;color:var(--muted)}
  .meta b{color:var(--ink-2);font-weight:500}
  .kpi{display:flex;align-items:center;gap:12px}
  .kpi .num{font-family:var(--mono);font-weight:600;font-size:30px;
    font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.01em}
  .kpi .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;
    color:var(--muted);line-height:1.25}
  .ramp{width:120px;height:9px;border-radius:5px;border:1px solid var(--line)}
  .ramp-wrap{display:flex;flex-direction:column;gap:4px}
  .ramp-ends{display:flex;justify-content:space-between;font-size:9.5px;
    letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  /* ---- controls / breadcrumb ---- */
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding-block:9px;min-height:40px}
  .crumbs{display:flex;align-items:center;gap:7px;font-family:var(--mono);
    font-size:12.5px;min-width:0}
  .crumb{color:var(--ink-2);background:none;border:0;padding:0;cursor:pointer;
    font:inherit;border-radius:4px}
  .crumb.link{color:var(--accent)}
  .crumb.link:hover{text-decoration:underline}
  .crumb.here{color:var(--ink);font-weight:600;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .sep{color:var(--muted)}
  .seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);
    border-radius:8px;padding:2px;gap:2px}
  .seg button{font:inherit;font-size:11.5px;font-family:var(--mono);
    border:0;background:none;color:var(--ink-2);padding:4px 10px;border-radius:6px;
    cursor:pointer;letter-spacing:.02em}
  .seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);
    box-shadow:var(--shadow)}
  .hint{font-size:11.5px;color:var(--muted)}
  /* ---- map ---- */
  main{flex:1 1 auto;position:relative;min-height:0;padding-block:2px 14px}
  #map{position:absolute;inset:0 0 14px 0;border-radius:12px;overflow:hidden;
    background:var(--panel-2);border:1px solid var(--line)}
  .cell{position:absolute;border-radius:3px;overflow:hidden;cursor:pointer;
    transition:left .42s cubic-bezier(.4,0,.2,1),top .42s cubic-bezier(.4,0,.2,1),
      width .42s cubic-bezier(.4,0,.2,1),height .42s cubic-bezier(.4,0,.2,1),
      opacity .3s ease,filter .12s ease;
    will-change:left,top,width,height}
  .cell:hover{filter:brightness(1.09);z-index:5;
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
  .cell.static{cursor:default}
  .cell .lbl{position:absolute;left:8px;top:6px;right:8px;pointer-events:none}
  .cell .cn{font-family:var(--mono);font-weight:500;font-size:11.5px;
    display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .cx{font-family:var(--mono);font-size:10px;opacity:.72;letter-spacing:.02em}
  .cell.enter{animation:pop .34s cubic-bezier(.2,.7,.3,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.975)}to{opacity:1;transform:none}}
  /* ---- tooltip ---- */
  #tip{position:fixed;z-index:50;pointer-events:none;opacity:0;
    transform:translateY(4px);transition:opacity .12s ease,transform .12s ease;
    background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;max-width:260px}
  #tip.on{opacity:1;transform:none}
  #tip .t-name{font-family:var(--mono);font-weight:600;font-size:12.5px;
    margin-bottom:6px;word-break:break-all}
  #tip .t-grid{display:grid;grid-template-columns:auto auto;gap:2px 14px;
    font-family:var(--mono);font-size:11px;color:var(--ink-2)}
  #tip .t-grid b{color:var(--ink);font-weight:600;text-align:right;
    font-variant-numeric:tabular-nums}
  #tip .t-dec{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-2)}
  .dot{width:10px;height:10px;border-radius:3px;flex:none}
  /* ---- detail panel ---- */
  #panel{position:absolute;top:8px;right:8px;width:270px;max-width:calc(100% - 16px);
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:16px;z-index:8;
    transition:opacity .2s ease,transform .2s ease}
  #panel[hidden]{opacity:0;transform:translateY(-6px)}
  #panel .p-fn{font-family:var(--mono);font-weight:600;font-size:14px;
    word-break:break-all;margin-bottom:2px}
  #panel .p-sub{font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.1em;margin-bottom:13px}
  .stat{display:flex;justify-content:space-between;align-items:baseline;
    padding:5px 0;border-top:1px solid var(--line);font-size:12.5px}
  .stat:first-of-type{border-top:0}
  .stat .k{color:var(--ink-2)}
  .stat .v{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
  .decbar{height:8px;border-radius:5px;background:var(--panel-2);
    border:1px solid var(--line);overflow:hidden;margin:5px 0 2px}
  .decbar i{display:block;height:100%}
  .cta{margin-top:14px;width:100%;border:0;border-radius:9px;cursor:pointer;
    background:var(--accent);color:#04160c;font:inherit;font-weight:600;
    padding:10px;letter-spacing:.01em}
  :root[data-theme="dark"] .cta,:root:not([data-theme="light"]) .cta{color:#04160c}
  .cta:hover{filter:brightness(1.06)}
  .snippet{margin-top:11px;font-family:var(--mono);font-size:10.5px;
    color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);
    border-radius:8px;padding:9px 10px;white-space:pre-wrap;line-height:1.5}
  .snippet .c{color:var(--muted)}
  @media (max-width:560px){
    #panel{position:static;width:auto;margin-top:10px}
    main{overflow-y:auto}
    #map{position:relative;inset:auto;height:62vh}
    .prog{max-width:60vw}
  }
  @media (prefers-reduced-motion:reduce){
    .cell,#panel,#tip{transition:none}.cell.enter{animation:none}
  }
</style>

<div class="app">
  <header>
    <div class="brand">
      <span class="wordmark">Deciphered</span>
      <span class="prog" id="progName">program</span>
    </div>
    <div class="grow"></div>
    <div class="meta" id="meta"></div>
    <div class="kpi">
      <div class="ramp-wrap">
        <div class="ramp" id="ramp"></div>
        <div class="ramp-ends"><span>opaque</span><span>deciphered</span></div>
      </div>
      <div style="text-align:right">
        <div class="num" id="kpiNum">–</div>
        <div class="lab">deciphered<br>score</div>
      </div>
    </div>
  </header>

  <div class="bar">
    <nav class="crumbs" id="crumbs"></nav>
    <div class="grow"></div>
    <span class="hint" id="hint">click a function to inspect it</span>
    <div class="seg" role="group" aria-label="Size blocks by">
      <button id="byComplexity" aria-pressed="true">complexity</button>
      <button id="bySize" aria-pressed="false">instructions</button>
    </div>
  </div>

  <main>
    <div id="map" aria-label="program complexity map"></div>
    <aside id="panel" hidden></aside>
  </main>
</div>

<div id="tip" role="tooltip"></div>

<script>
const DATA = __DATA__;

/* ---------- deciphered → color (sequential grey→green ramp, per theme) ---------- */
const RAMP = {
  light:[[198,204,199],[95,183,138],[15,155,80]],
  dark :[[58,66,80],[44,140,92],[55,214,122]],
};
function isDark(){
  const t=document.documentElement.getAttribute('data-theme');
  if(t) return t==='dark';
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
function lerp(a,b,t){return a+(b-a)*t}
function rampColor(v){
  const s=RAMP[isDark()?'dark':'light'];
  v=Math.max(0,Math.min(1,v));
  const seg=v*(s.length-1), i=Math.min(s.length-2,Math.floor(seg)), f=seg-i;
  const c=[0,1,2].map(k=>Math.round(lerp(s[i][k],s[i+1][k],f)));
  return c;
}
const css=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
function inkOn(c){ // choose readable label ink from cell luminance
  const l=0.299*c[0]+0.587*c[1]+0.114*c[2];
  return l>142? 'rgba(10,16,14,.9)' : 'rgba(238,244,247,.94)';
}

/* ---------- squarified treemap (Bruls, Huizing, van Wijk) ---------- */
function squarify(children, X, Y, W, H){
  const total=children.reduce((s,c)=>s+Math.max(c.value,1e-6),0);
  const scale=(W*H)/total;
  const items=children.map(c=>({c,area:Math.max(c.value,1e-6)*scale}));
  const out=[]; let i=0;
  while(i<items.length){
    const len=Math.min(W,H);
    let best=Infinity, row=[], j=i;
    while(j<items.length){
      const trial=row.concat(items[j]);
      const s=trial.reduce((a,b)=>a+b.area,0);
      const mx=Math.max(...trial.map(b=>b.area)), mn=Math.min(...trial.map(b=>b.area));
      const w=Math.max((len*len*mx)/(s*s),(s*s)/(len*len*mn));
      if(row.length && w>best){break;}
      row=trial; best=w; j++;
    }
    const s=row.reduce((a,b)=>a+b.area,0);
    if(W<=H){
      const rh=s/W; let cx=X;
      for(const it of row){const cw=it.area/rh; out.push({c:it.c,x:cx,y:Y,w:cw,h:rh}); cx+=cw;}
      Y+=rh; H-=rh;
    }else{
      const cw=s/H; let cy=Y;
      for(const it of row){const ch=it.area/cw; out.push({c:it.c,x:X,y:cy,w:cw,h:ch}); cy+=ch;}
      X+=cw; W-=cw;
    }
    i=j;
  }
  return out;
}

/* ---------- state ---------- */
let view='program';          // 'program' | function-name
let sizeBy='complexity';     // 'complexity' | 'size'
const map=document.getElementById('map');
const tip=document.getElementById('tip');
const panel=document.getElementById('panel');
const byName=Object.fromEntries(DATA.functions.map(f=>[f.name,f]));

function fnValue(f){ return sizeBy==='size'? f.size : f.complexity; }

function nodes(){
  if(view==='program')
    return DATA.functions.map(f=>({value:fnValue(f), kind:'fn', f}));
  const f=byName[view];
  return (f.blocks||[]).map(b=>({value:b.len, kind:'block', b, f}));
}

function render(animate){
  const W=map.clientWidth, H=map.clientHeight;
  if(W<2||H<2){requestAnimationFrame(()=>render(animate));return;}
  const items=nodes().filter(n=>n.value>0);
  const rects=squarify(items, 0,0,W,H);
  const keep=new Set();
  rects.forEach((r,idx)=>{
    const n=r.c;
    const dec=n.kind==='fn'? n.f.deciphered : n.b.deciphered;
    const col=rampColor(dec);
    const key=n.kind==='fn'? 'fn:'+n.f.name : 'bl:'+n.b.start;
    keep.add(key);
    let el=map.querySelector(`[data-k="${CSS.escape(key)}"]`);
    const fresh=!el;
    if(fresh){
      el=document.createElement('div');
      el.className='cell'+(n.kind==='block'?' static':'');
      el.dataset.k=key;
      el.innerHTML='<div class="lbl"><span class="cn"></span> <span class="cx"></span></div>';
      map.appendChild(el);
      bind(el,n);
    }
    el.style.background=css(col);
    el.style.color=inkOn(col);
    const pad=2;
    el.style.left=(r.x+pad/2)+'px'; el.style.top=(r.y+pad/2)+'px';
    el.style.width=Math.max(0,r.w-pad)+'px'; el.style.height=Math.max(0,r.h-pad)+'px';
    const label = n.kind==='fn'? n.f.name : n.b.kind;
    const sub   = n.kind==='fn'? 'cx '+n.f.complexity : n.b.len+'i';
    el.querySelector('.cn').textContent=label;
    el.querySelector('.cx').textContent=sub;
    const showLbl = r.w>52 && r.h>24;
    el.querySelector('.lbl').style.display=showLbl?'block':'none';
    el._n=n;
    if(fresh && animate){ el.classList.add('enter'); el.style.animationDelay=Math.min(idx*4,180)+'ms';
      el.addEventListener('animationend',()=>{el.classList.remove('enter');el.style.animationDelay='';},{once:true}); }
  });
  map.querySelectorAll('.cell').forEach(el=>{ if(!keep.has(el.dataset.k)) el.remove(); });
}

/* ---------- interactions ---------- */
function bind(el,n){
  el.addEventListener('mousemove',e=>showTip(e,el._n));
  el.addEventListener('mouseleave',hideTip);
  if(el._n?.kind!=='block' || n.kind==='fn'){
    if(n.kind==='fn') el.addEventListener('click',()=>open(n.f.name));
  }
}
function showTip(e,n){
  const f = n.kind==='fn'? n.f : n.f;
  const dec = n.kind==='fn'? n.f.deciphered : n.b.deciphered;
  const col=rampColor(dec);
  let rows;
  if(n.kind==='fn'){
    rows=`<div class="t-grid">
      <span>complexity</span><b>${f.complexity}</b>
      <span>instructions</span><b>${f.size}</b>
      <span>branches</span><b>${f.branches}</b>
      <span>calls</span><b>${f.calls}</b>
      <span>indirect (callx)</span><b>${f.callx}</b>
      <span>entry pc</span><b>${f.pc}</b></div>`;
  }else{
    rows=`<div class="t-grid">
      <span>kind</span><b>${n.b.kind}</b>
      <span>instructions</span><b>${n.b.len}</b>
      <span>start pc</span><b>${n.b.start}</b></div>`;
  }
  tip.innerHTML=`<div class="t-name">${n.kind==='fn'?f.name:f.name+'  ·  block'}</div>${rows}
    <div class="t-dec"><span class="dot" style="background:${css(col)}"></span>
      deciphered <b style="color:var(--ink);margin-left:auto;font-family:var(--mono)">${Math.round(dec*100)}%</b></div>`;
  tip.classList.add('on');
  const pad=14, w=tip.offsetWidth, h=tip.offsetHeight;
  let x=e.clientX+pad, y=e.clientY+pad;
  if(x+w>innerWidth-8) x=e.clientX-w-pad;
  if(y+h>innerHeight-8) y=e.clientY-h-pad;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){tip.classList.remove('on');}

function open(name){ view=name; render(true); crumbs(); detail(byName[name]); hideTip(); }
function home(){ view='program'; render(true); crumbs(); panel.hidden=true; hideTip(); }

function crumbs(){
  const el=document.getElementById('crumbs');
  if(view==='program'){
    el.innerHTML=`<span class="crumb here">${DATA.functions.length} functions</span>`;
    document.getElementById('hint').textContent='click a function to inspect it';
  }else{
    el.innerHTML=`<button class="crumb link" id="bk">program</button>
      <span class="sep">▸</span><span class="crumb here">${view}</span>`;
    document.getElementById('bk').onclick=home;
    document.getElementById('hint').textContent='basic blocks · sized by instruction count';
  }
}
function detail(f){
  const col=rampColor(f.deciphered);
  panel.innerHTML=`
    <div class="p-fn">${f.name}</div>
    <div class="p-sub">function · sbpf ${DATA.sbpf_version.toLowerCase()}</div>
    <div class="stat"><span class="k">Deciphered</span>
      <span class="v" style="color:${css(col)}">${Math.round(f.deciphered*100)}%</span></div>
    <div class="decbar"><i style="width:${Math.round(f.deciphered*100)}%;background:${css(col)}"></i></div>
    <div class="stat"><span class="k">Cyclomatic complexity</span><span class="v">${f.complexity}</span></div>
    <div class="stat"><span class="k">Instructions</span><span class="v">${f.size}</span></div>
    <div class="stat"><span class="k">Basic blocks</span><span class="v">${(f.blocks||[]).length}</span></div>
    <div class="stat"><span class="k">Conditional branches</span><span class="v">${f.branches}</span></div>
    <div class="stat"><span class="k">Direct calls</span><span class="v">${f.calls}</span></div>
    <div class="stat"><span class="k">Indirect calls (callx)</span><span class="v">${f.callx}</span></div>
    <div class="stat"><span class="k">Entry PC</span><span class="v">${f.pc}</span></div>
    <button class="cta" id="dc">Decompile ${f.name.length>16?'function':f.name}</button>
    <div class="snippet" id="snip" hidden></div>`;
  panel.hidden=false;
  document.getElementById('dc').onclick=()=>{
    const s=document.getElementById('snip');
    s.hidden=false;
    s.innerHTML=`<span class="c"># lift + symbolically execute just this function</span>\n`+
      `elf.get_function_call_args(msg, <span style="color:var(--accent)">"${f.name}"</span>)\n`+
      `<span class="c"># entry pc ${f.pc} · ${f.size} instrs · cx ${f.complexity}</span>`;
  };
}

/* ---------- chrome ---------- */
function paintRamp(){
  const s=RAMP[isDark()?'dark':'light'];
  document.getElementById('ramp').style.background=
    `linear-gradient(90deg,${css(s[0])},${css(s[1])},${css(s[2])})`;
}
function init(){
  document.getElementById('progName').textContent=DATA.program.split('/').pop();
  document.getElementById('progName').title=DATA.program;
  document.getElementById('kpiNum').textContent=Math.round(DATA.deciphered_pct*100)+'%';
  document.getElementById('kpiNum').style.color=css(rampColor(DATA.deciphered_pct));
  document.getElementById('meta').innerHTML=
    `<span><b>${DATA.functions_count}</b> functions</span>`+
    `<span><b>${DATA.instructions.toLocaleString()}</b> instructions</span>`+
    `<span>sbpf <b>${DATA.sbpf_version.toLowerCase()}</b></span>`;
  paintRamp(); crumbs(); render(true);
}
document.getElementById('byComplexity').onclick=()=>setSize('complexity');
document.getElementById('bySize').onclick=()=>setSize('size');
function setSize(m){
  sizeBy=m;
  document.getElementById('byComplexity').setAttribute('aria-pressed',m==='complexity');
  document.getElementById('bySize').setAttribute('aria-pressed',m==='size');
  render(false);
}
addEventListener('keydown',e=>{if(e.key==='Escape'&&view!=='program')home();});
let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>render(false),120);});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{paintRamp();render(false);
  document.getElementById('kpiNum').style.color=css(rampColor(DATA.deciphered_pct));});
new MutationObserver(()=>{paintRamp();render(false);
  document.getElementById('kpiNum').style.color=css(rampColor(DATA.deciphered_pct));})
  .observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
init();
</script>
